<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>전송 완료 — ARTPORT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500&family=Syne:wght@700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #0c0b0a;
      color: #f0ebe3;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 2rem;
      margin-bottom: 1rem;
      color: #c4a574;
    }
    p { color: #9a9288; margin-bottom: 2rem; line-height: 1.8; }
    a {
      display: inline-block;
      padding: 0.875rem 2rem;
      background: #c4a574;
      color: #0c0b0a;
      text-decoration: none;
      border-radius: 4px;
      font-weight: 500;
      font-size: 0.875rem;
    }
    a:hover { background: #d4b584; }
  </style>
</head>
<body>
  <div>
    <h1>메시지가 전송되었습니다</h1>
    <p>소중한 메시지 감사합니다.<br>빠른 시일 내에 답변 드리겠습니다.</p>
    <a href="/">홈으로 돌아가기</a>
  </div>
</body>
</html>
